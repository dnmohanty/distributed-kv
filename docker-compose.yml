version: '3.8'
services:
  proxy:
    build: .
    command: ./kv_server --proxy 7000 node1:8080 node2:8081 node3:8082
    ports:
      - "7000:7000"
    depends_on:
      - node1
      - node2
      - node3

  node1:
    build: .
    command: ./kv_server --server 8080 node1:8080 node2:8081 node3:8082
    volumes:
      - ./data/node1:/app/build

  node2:
    build: .
    command: ./kv_server --server 8081 node1:8080 node2:8081 node3:8082
    volumes:
      - ./data/node2:/app/build

  node3:
    build: .
    command: ./kv_server --server 8082 node1:8080 node2:8081 node3:8082
    volumes:
      - ./data/node3:/app/build
