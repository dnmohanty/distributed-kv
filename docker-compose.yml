version: '3.8'
services:
  proxy:
    build: .
    command: ./kv_server proxy 7000 node1:8080 node2:8081 node3:8082
    ports:
      - "7000:7000"
    depends_on:
      - node1
      - node2
      - node3

  node1:
    build: .
    working_dir: /app/data
    command: /app/build/kv_server 8080 node1:8080 node2:8081 node3:8082
    ports:
      - "8080:8080"
    volumes:
      - ./data/node1:/app/data

  node2:
    build: .
    working_dir: /app/data
    command: /app/build/kv_server 8081 node1:8080 node2:8081 node3:8082
    ports:
      - "8081:8081"
    volumes:
      - ./data/node2:/app/data

  node3:
    build: .
    working_dir: /app/data
    command: /app/build/kv_server 8082 node1:8080 node2:8081 node3:8082
    ports:
      - "8082:8082"
    volumes:
      - ./data/node3:/app/data